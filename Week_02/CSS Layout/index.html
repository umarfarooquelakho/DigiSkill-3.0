<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Layout</title>
    <style>
        .box {
            background: orange;
            padding: 10px;
            margin: 5px;
        }

        .block {
            display: block;
        }

        .inline {
            display: inline;
        }

        .inline-block {
            display: inline-block;
            width: 150px;
        }

        .none {
            display: none;
        }
    </style>
</head>
<body>
    <div class="box block">Block Element</div>
    <div class="box inline">Inline 1</div>
    <div class="box inline">Inline 2</div>

    <br><br>
    <div class="box inline-block">Inline Block 1</div>
    <div class="box inline-block">Inline Block 2</div>

    <div class="box none">This element is hidden</div>
</body>
</html>
