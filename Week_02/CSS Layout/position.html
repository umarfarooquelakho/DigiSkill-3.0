<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent {
            position: relative;
            width: 200px;
            height: 200px;
            background-color: lightblue;
        }

        .child {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 100px;
            height: 100px;
            background-color: lightcoral;
        }

        .fixed-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: lightgreen;
        }
    </style>
</head>
<body>
    <div class="parent">
        Parent

        <div class="child">Child</div>
    </div>

    <div class="fixed-btn">Help</div>
</body>
</html>
