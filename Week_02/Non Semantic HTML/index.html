<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 2. Non-Semantic HTML Elements -->
    <!-- Non-semantic elements don't tell us what their content represents. -->
    <div>
        <h2>Welcome</h2>
        <p>Hello Students!</p>
        <span>We are learning HTML</span>
    </div>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>
    <ol type="a">
        <li>HTML 1</li>
        <li>CSS 1</li>
        <li>JavaScript 1</li>
    </ol>
</body>
</html>
