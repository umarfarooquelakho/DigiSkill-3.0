<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Log In</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Left Section -->
        <section class="intro">
            <h1>facebook</h1>

            <p>
                Facebook helps you connect and share
                with the people in your life.
            </p>
        </section>


        <!-- Login Card -->
        <section class="login-section">

            <div class="login-card">

                <form id="loginForm">

                    <input
                        type="text"
                        id="email"
                        placeholder="Email address or phone number"
                        autocomplete="off"
                    >

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                    >

                    <button type="submit" class="login-btn">
                        Log In
                    </button>

                    <a href="#" class="forgot-password">
                        Forgotten password?
                    </a>

                    <div class="divider"></div>

                    <button
                        type="button"
                        class="create-account"
                        id="createAccount"
                    >
                        Create new account
                    </button>

                </form>

                <p id="message" class="message"></p>

            </div>

            <p class="create-page">
                <strong>Create a Page</strong> for a celebrity,
                brand or business.
            </p>

        </section>

    </main>


    <footer>
        <p>English (US) &nbsp; Urdu &nbsp; Español &nbsp; Français &nbsp; العربية</p>
        <p>© 2026 Facebook-style Demo</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
